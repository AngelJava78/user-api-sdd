[project]
name = "users-api"
version = "0.1.0"
description = "API REST de gestión de usuarios (Spec-Driven Development)."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "asyncpg>=0.30",
    "alembic>=1.13",
    "structlog>=24.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "schemathesis>=3.0",
    "testcontainers[postgres]>=4.0",
    "locust>=2.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "SIM", "RUF", "ASYNC"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
addopts = ["-ra", "--strict-markers", "--strict-config", "--cov"]

# NFR-007: cobertura mínima del 90 % en domain/ y application/.
[tool.coverage.run]
source = ["src/app/domain", "src/app/application"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
